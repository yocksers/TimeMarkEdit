<div is="emby-scroller" data-controller="configurationpage?name=TimeMarkEditSummaryManager" class="view flex flex-direction-column scrollFrameY flex-grow" data-horizontal="false" data-forcescrollbar="true" data-centerfocus="true" data-bindheader="true" data-title="TimeMarkEdit - Summary">
    <div class="scrollSlider flex-direction-column padded-left padded-left-page padded-right padded-top-page padded-bottom-page">
        <div class="readOnlyContent auto-center" style="max-width: 900px;">
            <h1 class="pageTitle">TimeMarkEdit &mdash; Library Summary</h1>

            <style>
                .tme-summary-table {
                    width: 100%;
                    border-collapse: collapse;
                    font-size: 0.9em;
                }

                .tme-summary-table th {
                    text-align: left;
                    padding: 0.5em 0.8em;
                    font-weight: 600;
                    opacity: 0.6;
                    font-size: 0.82em;
                    border-bottom: 1px solid rgba(255,255,255,0.14);
                }

                .tme-summary-series-row td {
                    padding: 0.55em 0.8em 0.5em;
                    font-weight: 700;
                    font-size: 0.95em;
                    border-top: 1px solid rgba(255,255,255,0.1);
                    padding-top: 1.1em;
                    cursor: pointer;
                }

                .tme-summary-series-row:first-of-type td {
                    border-top: none;
                }

                .tme-summary-toggle-icon {
                    display: inline-block;
                    vertical-align: middle;
                    margin-right: 0.3em;
                    font-size: 1.1em;
                    opacity: 0.7;
                    transition: transform 0.15s;
                }

                .tme-summary-series-row.expanded .tme-summary-toggle-icon {
                    transform: rotate(90deg);
                }

                .tme-summary-season-row td {
                    padding: 0.32em 0.8em;
                    font-size: 0.88em;
                    border-bottom: 1px solid rgba(255,255,255,0.05);
                    font-weight: 600;
                    cursor: pointer;
                }

                .tme-summary-season-row.expanded .tme-summary-toggle-icon {
                    transform: rotate(90deg);
                }

                .tme-row-flex {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    gap: 0.5em;
                }

                .tme-row-name {
                    flex: 1 1 auto;
                    min-width: 0;
                }

                .tme-row-flex .tme-detect-btn {
                    flex-shrink: 0;
                }

                .tme-summary-episode-row td {
                    padding: 0.28em 0.8em;
                    font-size: 0.85em;
                    opacity: 0.85;
                    border-bottom: 1px solid rgba(255,255,255,0.03);
                }

                .tme-summary-episode-row:last-child td,
                .tme-summary-season-row:last-child td {
                    border-bottom: none;
                }

                .tme-detect-btn {
                    padding: 0.15em 0.6em !important;
                    font-size: 0.78em !important;
                    background: rgba(230,126,34,0.14) !important;
                    border-color: rgba(230,126,34,0.4) !important;
                    color: #f0b27a !important;
                    margin-left: 0.6em;
                }

                .tme-detect-btn .md-icon {
                    font-size: 1em;
                    margin-right: 0.2em;
                    vertical-align: middle;
                }

                .tme-status-yesno {
                    opacity: 0.75;
                }

                .tme-pct-bar-wrap {
                    display: inline-flex;
                    align-items: center;
                    gap: 0.5em;
                }

                .tme-pct-bar {
                    display: inline-block;
                    height: 6px;
                    border-radius: 3px;
                    width: 60px;
                    background: rgba(255,255,255,0.1);
                    vertical-align: middle;
                    overflow: hidden;
                }

                .tme-pct-fill-intro {
                    display: block;
                    height: 100%;
                    background: rgba(41, 128, 185, 0.85);
                    border-radius: 3px;
                }

                .tme-pct-fill-credits {
                    display: block;
                    height: 100%;
                    background: rgba(230, 126, 34, 0.85);
                    border-radius: 3px;
                }

                .tme-avg {
                    opacity: 0.55;
                    font-size: 0.88em;
                    margin-left: 0.3em;
                }
            </style>

            <div id="tmeSummaryStatus" style="padding:1.5em 0;opacity:0.45;font-size:0.9em;">Loading&hellip;</div>

            <table class="tme-summary-table" id="tmeSummaryTable" style="display:none;">
                <thead>
                    <tr>
                        <th style="width:35%;">Series / Season</th>
                        <th style="width:10%;text-align:center;">Episodes</th>
                        <th style="width:25%;">Intro</th>
                        <th style="width:10%;text-align:center;">Avg Intro</th>
                        <th style="width:20%;">Credits</th>
                    </tr>
                </thead>
                <tbody id="tmeSummaryBody"></tbody>
            </table>

            <div id="tmeDetectionProgressBar" style="display:none;margin-top:1em;background:rgba(230,126,34,0.07);border:1px solid rgba(230,126,34,0.25);border-radius:8px;padding:0.7em 0.9em;">
                <div style="display:flex;align-items:center;gap:0.6em;flex-wrap:wrap;margin-bottom:0.5em;">
                    <span id="tmeDetectionStatusText" style="font-size:0.87em;font-weight:600;color:#e59866;">Starting EmbyCredits detection&hellip;</span>
                    <span id="tmeDetectionPercentText" style="font-size:0.82em;opacity:0.75;margin-left:auto;">0%</span>
                    <button is="emby-button" type="button" id="btnCancelTmeDetection" class="raised" style="padding:0.2em 0.8em;font-size:0.8em;background-color:#b71c1c;">Cancel</button>
                </div>
                <div style="height:8px;border-radius:4px;background:rgba(255,255,255,0.1);overflow:hidden;">
                    <div id="tmeDetectionProgressFill" style="height:100%;width:0%;background:rgba(230,126,34,0.85);transition:width 0.3s;"></div>
                </div>
                <div id="tmeDetectionCountsText" style="font-size:0.8em;opacity:0.65;margin-top:0.4em;"></div>
            </div>
        </div>
    </div>
</div>
